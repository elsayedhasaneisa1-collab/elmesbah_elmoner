<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - مسابقة المصباح المنير</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginScreen" class="login-screen">
<div class="login-box">
<img src="assets/logo.png" class="login-logo" alt="logo">
<h2>لوحة التحكم</h2>
<p>ادخل كلمة المرور</p>
<input type="password" id="passwordInput" placeholder="كلمة المرور">
<button id="loginBtn"><i class="fa-solid fa-lock"></i> دخول</button>
<p id="loginError" class="login-error"></p>
</div>
</div>

<div id="dashboard" class="dashboard" style="display:none;">

<header class="dash-header">
<div class="dash-title">
<img src="assets/logo.png" alt="logo" class="dash-logo">
<h1>المتسابقون</h1>
</div>
<button id="logoutBtn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
</header>

<div class="stats">
<div class="stat-card">
<i class="fa-solid fa-users"></i>
<div>
<span class="stat-num" id="totalCount">0</span>
<span class="stat-label">إجمالي المتسابقين</span>
</div>
</div>
<div class="stat-card green">
<i class="fa-solid fa-seedling"></i>
<div>
<span class="stat-num" id="beginnerCount">0</span>
<span class="stat-label">مبتدئ</span>
</div>
</div>
<div class="stat-card orange">
<i class="fa-solid fa-book"></i>
<div>
<span class="stat-num" id="midCount">0</span>
<span class="stat-label">متوسط</span>
</div>
</div>
<div class="stat-card red">
<i class="fa-solid fa-star"></i>
<div>
<span class="stat-num" id="advancedCount">0</span>
<span class="stat-label">متقدم</span>
</div>
</div>
</div>

<div class="toolbar">
<input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الموبايل أو الرقم القومي...">
<select id="filterLevel">
<option value="">كل المستويات</option>
<option value="مبتدئ">مبتدئ</option>
<option value="متوسط">متوسط</option>
<option value="متقدم">متقدم</option>
</select>
<button id="addBtn" class="add-btn"><i class="fa-solid fa-plus"></i> إضافة متسابق</button>
<button id="exportBtn" class="export-btn"><i class="fa-solid fa-file-excel"></i> Excel</button>
<button id="exportPdfBtn" class="pdf-btn"><i class="fa-solid fa-file-pdf"></i> PDF</button>
<button id="refreshBtn" class="refresh-btn"><i class="fa-solid fa-rotate"></i> تحديث</button>
</div>

<div class="table-wrap">
<table id="dataTable">
<thead>
<tr>
<th style="width:40px;"><input type="checkbox" id="selectAll" class="select-all-check"></th>
<th>#</th>
<th class="sortable" data-sort="name">الاسم <i class="fa-solid fa-sort"></i></th>
<th>الموبايل</th>
<th>الرقم القومي</th>
<th class="sortable" data-sort="level">المستوى <i class="fa-solid fa-sort"></i></th>
<th class="sortable" data-sort="birth_date">تاريخ الميلاد <i class="fa-solid fa-sort"></i></th>
<th class="sortable" data-sort="created_at">وقت التسجيل <i class="fa-solid fa-sort"></i></th>
<th>إجراءات</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
<p id="emptyMsg" class="empty-msg" style="display:none;">لا يوجد متسابقون حتى الآن</p>
</div>

</div>

<div id="editModal" class="modal">
<div class="modal-box">
<h3 id="modalTitle">تعديل بيانات المتسابق</h3>
<form id="editForm">
<input type="hidden" id="editId">
<div class="field">
<label>الاسم</label>
<input type="text" id="editName" required>
</div>
<div class="field">
<label>رقم الموبايل</label>
<input type="tel" id="editPhone" required>
</div>
<div class="field">
<label>الرقم القومي</label>
<input type="text" id="editNationalId" maxlength="14" required>
</div>
<div class="field">
<label>المستوى</label>
<select id="editLevel" required>
<option value="مبتدئ">مبتدئ</option>
<option value="متوسط">متوسط</option>
<option value="متقدم">متقدم</option>
</select>
</div>
<div class="field">
<label>تاريخ الميلاد</label>
<div class="date-group">
<select id="editBirthDay" required>
<option value="">اليوم</option>
</select>
<select id="editBirthMonth" required>
<option value="">الشهر</option>
</select>
<select id="editBirthYear" required>
<option value="">السنة</option>
</select>
</div>
</div>
<div class="modal-actions">
<button type="button" id="cancelBtn" class="cancel-btn">إلغاء</button>
<button type="submit" class="save-btn">حفظ</button>
</div>
</form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
