<body>

<div class="bg-decoration">
<div class="bg-circle bg-circle-1"></div>
<div class="bg-circle bg-circle-2"></div>
<div class="bg-circle bg-circle-3"></div>
</div>

<main class="container">

<header class="hero">
<div class="logo-glow"></div>
<img src="assets/logo.png" alt="شعار مسابقة المصباح المنير" class="logo" draggable="false">
<div class="bismillah">﷽</div>
<h1 class="title">مسابقة المصباح المنير</h1>
<div class="title-divider">
<span></span>
<i class="fa-solid fa-book-open"></i>
<span></span>
</div>
<p class="subtitle">سجّل الآن وكن من الحفظة</p>
</header>

<form id="regForm" class="form" autocomplete="off">

<div class="form-header">
<h2><i class="fa-solid fa-pen-to-square"></i> استمارة التسجيل</h2>
<p>املأ البيانات التالية بعناية</p>
</div>

<div class="field">
<label for="name">
<i class="fa-solid fa-user"></i>
<span>الاسم الرباعي</span>
</label>
<div class="input-wrap">
<input type="text" id="name" placeholder="اكتب اسمك الرباعي" required>
</div>
</div>

<div class="field">
<label for="phone">
<i class="fa-solid fa-mobile-screen"></i>
<span>رقم الموبايل</span>
</label>
<div class="input-wrap">
<input type="tel" id="phone" placeholder="01xxxxxxxxx" pattern="01[0-9]{9}" required>
</div>
</div>

<div class="field">
<label for="nationalId">
<i class="fa-solid fa-id-card"></i>
<span>الرقم القومي</span>
</label>
<div class="input-wrap">
<input type="text" id="nationalId" placeholder="14 رقم" pattern="[0-9]{14}" maxlength="14" required>
</div>
</div>

<div class="field">
<label for="level">
<i class="fa-solid fa-graduation-cap"></i>
<span>المستوى</span>
</label>
<div class="input-wrap">
<select id="level" required>
<option value="">-- اختر المستوى --</option>
<option value="مبتدئ">مبتدئ</option>
<option value="متوسط">متوسط</option>
<option value="متقدم">متقدم</option>
</select>
</div>
</div>

<div class="field">
<label>
<i class="fa-solid fa-calendar-days"></i>
<span>تاريخ الميلاد</span>
</label>
<div class="date-group">
<select id="birthDay" required>
<option value="">اليوم</option>
</select>
<select id="birthMonth" required>
<option value="">الشهر</option>
</select>
<select id="birthYear" required>
<option value="">السنة</option>
</select>
</div>
</div>

<button type="submit" class="submit-btn">
<span class="btn-text">سجّل الآن</span>
<i class="fa-solid fa-arrow-left"></i>
</button>

</form>

<div class="whatsapp-contact">
<a href="https://wa.me/201128351702?text=%D8%A7%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D9%85%D8%B3%D8%A7%D8%A8%D9%82%D8%A9%20%D8%A7%D9%84%D9%85%D8%B5%D8%A8%D8%A7%D8%AD%20%D8%A7%D9%84%D9%85%D9%86%D9%8A%D8%B1" target="_blank" rel="noopener" class="whatsapp-btn">
<i class="fa-brands fa-whatsapp"></i>
<span>تواصل معنا على واتساب</span>
</a>
</div>

<div id="successMsg" class="success-msg">
<div class="success-icon">
<i class="fa-solid fa-circle-check"></i>
</div>
<p>تم التسجيل بنجاح</p>
<span>جزاك الله خيرًا</span>
</div>

</main>
